version: "3.9"

services:
  api:
    build: .
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: retailer_app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/db/postgres

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  pgdata:
